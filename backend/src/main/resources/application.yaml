spring:
  application:
    name: fridge-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/fridge_db
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    io.github.olszewskif.fridge: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

app:
  external:
    open-food-facts:
      url: https://world.openfoodfacts.org/api/v3.6
  security:
    jwt:
      secret-key: ${JWT_SECRET:28lwgiYehEPDciWmQ98MnPHb3eW1BCdw8jEt3h+stRQ=}
      expiration-ms: 900000